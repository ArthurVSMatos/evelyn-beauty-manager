{% extends "base.html" %}
{% block content %}
<header class="page-header">
    <div>
        <p class="eyebrow">Cliente</p>
        <h1>{{ "Editar cliente" if client else "Nova cliente" }}</h1>
    </div>
</header>

<form method="post" class="form-card wide">
    <label>Nome
        <input type="text" name="name" value="{{ client.name if client else '' }}" required>
    </label>
    <label>Telefone
        <input type="tel" name="phone" value="{{ client.phone if client else '' }}" required>
    </label>
    <label>E-mail <span class="optional-label">opcional</span>
        <input type="email" name="email" value="{{ client.email if client else '' }}">
    </label>
    <label>Observações
        <textarea name="notes" rows="4">{{ client.notes if client else '' }}</textarea>
    </label>
    <div class="form-actions">
        <a class="btn" href="{{ url_for('clients.index') }}">Cancelar</a>
        <button class="btn primary" type="submit">Salvar</button>
    </div>
</form>
{% endblock %}
